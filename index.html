<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shoot Board</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a call sheet — masthead + role switcher, then "your availability", best-times heatmap, schedule, crew */
:root {
  --paper: #f7f7f5;
  --card: #ffffff;
  --ink: #17171c;
  --muted: #6a6a74;
  --line: #e2e2e6;
  --accent: #2b3fd6;
  --accent-ink: #ffffff;
  --heat0: #efeff2;
  --heat: 43, 63, 214;
  --danger: #b4232f;
  --r-sty: #c2410c; --r-mod: #be185d; --r-cd: #6d28d9; --r-pho: #0f766e; --r-hmu: #a16207;
  --display: "Bodoni Moda", "Didot", Georgia, serif;
  --body: "Instrument Sans", system-ui, -apple-system, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #121216; --card: #1b1b21; --ink: #ececf0; --muted: #9a9aa6; --line: #2c2c34;
  --accent: #8b98ff; --accent-ink: #10101a; --heat0: #23232b; --heat: 139, 152, 255; --danger: #f47c86;
  --r-sty: #fb923c; --r-mod: #f472b6; --r-cd: #a78bfa; --r-pho: #2dd4bf; --r-hmu: #facc15;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #121216; --card: #1b1b21; --ink: #ececf0; --muted: #9a9aa6; --line: #2c2c34;
  --accent: #8b98ff; --accent-ink: #10101a; --heat0: #23232b; --heat: 139, 152, 255; --danger: #f47c86;
  --r-sty: #fb923c; --r-mod: #f472b6; --r-cd: #a78bfa; --r-pho: #2dd4bf; --r-hmu: #facc15;
  color-scheme: dark }

* { box-sizing: border-box; }
body { margin: 0; }
[hidden] { display: none !important; }
body { background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 1080px; margin: 0 auto; padding-block: 28px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 28px; }
h1, h2 { font-family: var(--display); font-weight: 700; text-wrap: balance; margin: 0; line-height: 1.1; }
h1 { font-size: clamp(34px, 6vw, 52px); letter-spacing: -0.01em; }
h2 { font-size: 24px; }
.eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.masthead { display: grid; gap: 14px; border-bottom: 2px solid var(--ink); padding-bottom: 18px; }
.mast-row { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 12px; }
.status { font-family: var(--mono); font-size: 12px; color: var(--muted); }

.roles { display: flex; flex-wrap: wrap; gap: 8px; }
.pill { font: 500 14px var(--body); border: 1px solid var(--line); background: var(--card); color: var(--ink);
  padding: 7px 14px; border-radius: 999px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
.pill:hover { border-color: var(--ink); }
.pill[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.pill:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, .cell:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px; }

section { display: grid; gap: 14px; }
.sec-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 8px; }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 18px; display: grid; gap: 14px; min-width: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }

label { display: grid; gap: 5px; font-size: 13px; font-weight: 500; }
input, select, textarea { font: 400 15px var(--body); color: var(--ink); background: var(--paper); border: 1px solid var(--line);
  border-radius: 6px; padding: 8px 10px; width: 100%; }
textarea { resize: vertical; min-height: 60px; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
.btn { font: 600 14px var(--body); border-radius: 6px; padding: 9px 16px; cursor: pointer; border: 1px solid var(--accent);
  background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn.danger { background: transparent; color: var(--danger); border-color: var(--danger); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.checks { display: flex; flex-wrap: wrap; gap: 8px; }
.check { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 400; border: 1px solid var(--line);
  border-radius: 999px; padding: 5px 12px; cursor: pointer; }
.check input { width: auto; margin: 0; accent-color: var(--accent); }

/* availability grid */
.grid-scroll { overflow-x: auto; }
table.avail { border-collapse: separate; border-spacing: 4px; font-variant-numeric: tabular-nums; }
.avail th { font: 500 11px var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; padding: 0 2px; white-space: nowrap; }
.avail th.day { text-align: center; line-height: 1.3; }
.avail th.day b { display: block; font: 600 15px var(--body); color: var(--ink); letter-spacing: 0; text-transform: none; }
.avail th.day.weekend b { color: var(--accent); }
.avail th.slot { text-align: right; padding-right: 6px; }
.cell { width: 44px; height: 34px; border-radius: 5px; border: 1px solid var(--line); background: var(--heat0); cursor: pointer;
  font: 500 12px var(--mono); color: var(--ink); padding: 0; }
.cell.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.cell.ro { cursor: default; }
.legend { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.legend span.sw { width: 18px; height: 12px; border-radius: 3px; }

/* events */
.events { display: grid; gap: 10px; }
.event { display: grid; grid-template-columns: 88px 1fr auto; gap: 16px; align-items: start; background: var(--card);
  border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
.event .date { font-family: var(--mono); font-size: 12px; color: var(--muted); line-height: 1.35; }
.event .date b { display: block; font-family: var(--display); font-size: 30px; color: var(--ink); line-height: 1; }
.event .body { min-width: 0; display: grid; gap: 6px; }
.event .title { font-weight: 600; font-size: 17px; }
.type { font: 500 11px var(--mono); text-transform: uppercase; letter-spacing: .1em; border: 1px solid currentColor;
  border-radius: 4px; padding: 1px 6px; color: var(--accent); margin-right: 6px; vertical-align: 2px; }
.call { font-family: var(--mono); font-size: 13px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: 12px; display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line); border-radius: 999px; padding: 1px 9px; }
.event .notes { font-size: 14px; color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; }
@media (max-width: 560px) { .event { grid-template-columns: 1fr; gap: 8px; } .event .date b { display: inline; font-size: 22px; margin-right: 6px; } }

.crew { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.person { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; gap: 4px; }
.person .nm { font-weight: 600; }
.empty { border: 1px dashed var(--line); border-radius: 10px; padding: 22px; text-align: center; color: var(--muted); }
.two { display: grid; grid-template-columns: minmax(0, 1fr); gap: 28px; }
details summary { cursor: pointer; font-weight: 600; }
</style>
</head>
<body>

<div class="wrap">
  <header class="masthead">
    <div class="mast-row">
      <div>
        <div class="eyebrow">Creative team · call sheet</div>
        <h1>Shoot Board</h1>
      </div>
      <div class="status" id="status">Connecting…</div>
    </div>
    <div>
      <div class="eyebrow" style="margin-bottom:8px">Show me</div>
      <div class="roles" id="roleFilter" role="group" aria-label="Filter by role"></div>
    </div>
  </header>

  <section id="meSec">
    <div class="sec-head">
      <h2>Your availability</h2>
      <span class="muted small">Tap the slots you're free. It saves as you go.</span>
    </div>
    <div class="panel">
      <div class="form-grid">
        <label for="meName">Your name<input id="meName" placeholder="e.g. Aoife" autocomplete="name"></label>
        <label for="meRole">Your role<select id="meRole"></select></label>
      </div>
      <div class="grid-scroll"><table class="avail" id="meGrid"></table></div>
      <div class="muted small" id="meNote"></div>
    </div>
  </section>

  <section>
    <div class="sec-head">
      <h2>Best times</h2>
      <span class="legend" id="heatLegend"></span>
    </div>
    <div class="panel">
      <div class="muted small" id="heatCaption"></div>
      <div class="grid-scroll"><table class="avail" id="heatGrid"></table></div>
      <div class="small" id="bestPick"></div>
    </div>
  </section>

  <section>
    <div class="sec-head">
      <h2>Schedule</h2>
      <span class="muted small" id="eventCount"></span>
    </div>
    <div class="events" id="events"></div>
    <details class="panel" id="addWrap">
      <summary>Add a shoot, fitting or meeting</summary>
      <form id="evForm" class="form-grid" style="margin-top:4px">
        <label for="evTitle" style="grid-column:1/-1">Title<input id="evTitle" required placeholder="Winter issue cover shoot"></label>
        <label for="evType">Type<select id="evType">
          <option>Shoot</option><option>Fitting</option><option>Test shoot</option><option>Meeting</option><option>Other</option>
        </select></label>
        <label for="evDate">Date<input id="evDate" type="date" required></label>
        <label for="evCall">Call time<input id="evCall" type="time" value="09:00"></label>
        <label for="evWrap">Wrap<input id="evWrap" type="time" value="13:00"></label>
        <label for="evLoc" style="grid-column:1/-1">Location<input id="evLoc" placeholder="Studio, Newman Building"></label>
        <div style="grid-column:1/-1; display:grid; gap:6px">
          <span style="font-size:13px;font-weight:500">Who's needed</span>
          <div class="checks" id="evRoles"></div>
        </div>
        <label for="evNotes" style="grid-column:1/-1">Notes<textarea id="evNotes" placeholder="Looks, references, what to bring"></textarea></label>
        <div class="row" style="grid-column:1/-1">
          <button class="btn" type="submit" id="evSubmit">Add to schedule</button>
          <span class="small muted" id="evMsg"></span>
        </div>
      </form>
    </details>
  </section>

  <section>
    <div class="sec-head">
      <h2>Crew</h2>
      <span class="muted small" id="crewCount"></span>
    </div>
    <div class="crew" id="crew"></div>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* ===== PASTE YOUR SUPABASE DETAILS HERE (Project Settings → API) ===== */
const SUPABASE_URL = "https://pubznxrxyscqrbitlgho.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_1L1b4WY9bmwrKkJ7e6r9sw_9ZiLoAUM";
/* ===================================================================== */
const ROLES = [
  { id: "sty", label: "Stylists", one: "Stylist" },
  { id: "mod", label: "Models", one: "Model" },
  { id: "cd",  label: "Creative directors", one: "Creative director" },
  { id: "pho", label: "Photographers", one: "Photographer" },
  { id: "hmu", label: "Hair & makeup", one: "Hair & makeup" },
];
const roleById = Object.fromEntries(ROLES.map(r => [r.id, r]));
const SLOTS = [{ id: "am", label: "Morning" }, { id: "pm", label: "Afternoon" }, { id: "ev", label: "Evening" }];
const DAYS = 14;

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = n => String(n).padStart(2, "0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const days = (() => { const out = [], t = new Date(); t.setHours(0,0,0,0);
  for (let i = 0; i < DAYS; i++) { const d = new Date(t); d.setDate(t.getDate() + i); out.push(d); } return out; })();
const todayIso = iso(days[0]);

let filter = "all";
try { filter = localStorage.getItem("sb-filter") || "all"; } catch (e) {}
let people = [];      // [{id, name, role, slots:[]}]
let events = [];      // [{id, ...}]
let me = { id: null, name: "", role: "", slots: new Set() };
let sb = null, canWrite = true;

/* ---------- role filter ---------- */
function renderFilter() {
  const opts = [{ id: "all", label: "Everyone" }, ...ROLES];
  $("roleFilter").innerHTML = opts.map(o => `<button class="pill" type="button" data-f="${o.id}" aria-pressed="${filter === o.id}">
    ${o.id !== "all" ? `<span class="dot" style="background:var(--r-${o.id})"></span>` : ""}${esc(o.label)}</button>`).join("");
}
$("roleFilter").addEventListener("click", e => {
  const b = e.target.closest("[data-f]"); if (!b) return;
  filter = b.dataset.f; try { localStorage.setItem("sb-filter", filter); } catch (e) {}
  renderAll();
});

/* ---------- grids ---------- */
function headRow() {
  return `<tr><th></th>${days.map(d => {
    const wk = d.getDay() === 0 || d.getDay() === 6;
    return `<th class="day${wk ? " weekend" : ""}">${d.toLocaleDateString("en-IE", { weekday: "short" })}<b>${d.getDate()}</b>${d.getDate() === 1 || d === days[0] ? d.toLocaleDateString("en-IE", { month: "short" }) : "&nbsp;"}</th>`;
  }).join("")}</tr>`;
}
function renderMe() {
  $("meGrid").innerHTML = headRow() + SLOTS.map(s => `<tr><th class="slot">${s.label}</th>${days.map(d => {
    const k = iso(d) + "|" + s.id, on = me.slots.has(k);
    return `<td><button type="button" class="cell${on ? " on" : ""}" data-k="${k}" aria-pressed="${on}" aria-label="${s.label} ${d.toDateString()}" >${on ? "✓" : ""}</button></td>`;
  }).join("")}</tr>`).join("");
}
$("meGrid").addEventListener("click", e => {
  const b = e.target.closest("[data-k]"); if (!b || !sb) return;
  const k = b.dataset.k; me.slots.has(k) ? me.slots.delete(k) : me.slots.add(k);
  renderMe(); queueSave();
});

function visiblePeople() {
  return people.filter(p => (p.name || "").trim() && (filter === "all" || p.role === filter));
}
function renderHeat() {
  const ps = visiblePeople(), n = ps.length;
  const fl = filter === "all" ? "everyone" : roleById[filter].label.toLowerCase();
  $("heatCaption").textContent = n ? `How many of ${fl} (${n}) are free in each slot. Hover a slot to see who.` :
    `Nobody in ${fl} has added availability yet. Once people tap their free slots above, overlaps show up here.`;
  let best = null;
  $("heatGrid").innerHTML = headRow() + SLOTS.map(s => `<tr><th class="slot">${s.label}</th>${days.map(d => {
    const k = iso(d) + "|" + s.id, who = ps.filter(p => (p.slots || []).includes(k)), c = who.length;
    if (c && (!best || c > best.c)) best = { c, d, s, who };
    const a = n ? (c / n) : 0;
    const bg = c ? `rgba(var(--heat), ${0.18 + a * 0.82})` : "var(--heat0)";
    const fg = a > 0.55 ? "var(--accent-ink)" : "var(--ink)";
    return `<td><div class="cell ro" style="display:grid;place-items:center;background:${bg};border-color:transparent;color:${fg}" title="${esc(who.map(p => p.name).join(", ") || "No one")}">${c || ""}</div></td>`;
  }).join("")}</tr>`).join("");
  $("heatLegend").innerHTML = `<span class="sw" style="background:var(--heat0)"></span>none <span class="sw" style="background:rgba(var(--heat),.5)"></span>some <span class="sw" style="background:rgba(var(--heat),1)"></span>all free`;
  $("bestPick").innerHTML = best ? `<b>Best slot:</b> ${best.s.label.toLowerCase()} of ${best.d.toLocaleDateString("en-IE", { weekday: "long", day: "numeric", month: "long" })} — ${best.c} of ${n} free (${esc(best.who.map(p => p.name).join(", "))})` : "";
}

/* ---------- events ---------- */
function renderEvents() {
  const list = events.filter(e => e.date >= todayIso && (filter === "all" || (e.roles || []).includes(filter)))
    .sort((a, b) => (a.date + (a.call || "")).localeCompare(b.date + (b.call || "")));
  $("eventCount").textContent = list.length ? `${list.length} upcoming` : "";
  if (!list.length) {
    $("events").innerHTML = `<div class="empty">${events.length ? "Nothing upcoming for this role." : "No shoots or fittings yet. Add the first one below."}</div>`;
    return;
  }
  $("events").innerHTML = list.map(e => {
    const d = new Date(e.date + "T00:00");
    return `<article class="event">
      <div class="date"><b>${d.getDate()}</b>${d.toLocaleDateString("en-IE", { weekday: "short", month: "short" })}</div>
      <div class="body">
        <div class="title"><span class="type">${esc(e.type)}</span>${esc(e.title)}</div>
        <div class="call">Call ${esc(e.call || "—")} · Wrap ${esc(e.wrap || "—")}${e.loc ? ` · <span style="font-family:var(--body)">${esc(e.loc)}</span>` : ""}</div>
        <div class="tags">${(e.roles || []).map(r => roleById[r] ? `<span class="tag"><span class="dot" style="background:var(--r-${r})"></span>${roleById[r].label}</span>` : "").join("")}</div>
        ${e.notes ? `<div class="notes">${esc(e.notes)}</div>` : ""}
      </div>
      ${canWrite ? `<button class="btn ghost small" type="button" data-del="${esc(e.id)}">Remove</button>` : ""}
    </article>`;
  }).join("");
}
$("events").addEventListener("click", async e => {
  const b = e.target.closest("[data-del]"); if (!b) return;
  if (b.dataset.armed !== "1") { b.dataset.armed = "1"; b.textContent = "Confirm remove"; b.className = "btn danger small";
    setTimeout(() => { if (b.isConnected) { b.dataset.armed = ""; b.textContent = "Remove"; b.className = "btn ghost small"; } }, 4000); return; }
  b.disabled = true;
  const { error } = await sb.from("events").delete().eq("id", b.dataset.del);
  if (error) b.textContent = "Couldn't remove"; else loadEvents();
});

function renderCrew() {
  const ps = visiblePeople().sort((a, b) => a.name.localeCompare(b.name));
  $("crewCount").textContent = ps.length ? `${ps.length} ${ps.length === 1 ? "person" : "people"}` : "";
  $("crew").innerHTML = ps.length ? ps.map(p => {
    const r = roleById[p.role], free = (p.slots || []).filter(k => k >= todayIso).length;
    return `<div class="person"><div class="nm">${esc(p.name)}${p.id === me.id ? ' <span class="muted small">(you)</span>' : ""}</div>
      <div class="small">${r ? `<span class="tag"><span class="dot" style="background:var(--r-${p.role})"></span>${r.one}</span>` : '<span class="muted">No role set</span>'}</div>
      <div class="small muted">${free} free slot${free === 1 ? "" : "s"} in the next two weeks</div>
      ${p.id !== me.id ? `<button class="btn ghost small" type="button" data-claim="${esc(p.id)}" style="justify-self:start;padding:4px 10px;margin-top:4px">This is me</button>` : ""}</div>`;
  }).join("") : `<div class="empty" style="grid-column:1/-1">No one here yet. Share the link and ask the team to add their name, role and free slots.</div>`;
}

function renderAll() { renderFilter(); renderMe(); renderHeat(); renderEvents(); renderCrew(); }

/* ---------- form setup ---------- */
$("meRole").innerHTML = `<option value="">Choose…</option>` + ROLES.map(r => `<option value="${r.id}">${r.one}</option>`).join("");
$("evRoles").innerHTML = ROLES.map(r => `<label class="check" for="evr-${r.id}"><input type="checkbox" id="evr-${r.id}" value="${r.id}"><span class="dot" style="background:var(--r-${r.id})"></span>${r.label}</label>`).join("");
$("evDate").value = todayIso;
["meName", "meRole"].forEach(id => $(id).addEventListener("input", () => {
  me.name = $("meName").value.trim(); me.role = $("meRole").value; queueSave();
}));

let saveTimer = null;
function queueSave() { clearTimeout(saveTimer); saveTimer = setTimeout(saveMe, 600); setStatus("Saving…"); }
async function saveMe() {
  if (!sb) return;
  const row = { name: me.name, role: me.role || null, slots: [...me.slots].filter(k => k >= todayIso).sort(), updated_at: new Date().toISOString() };
  let res;
  if (me.id) res = await sb.from("people").update(row).eq("id", me.id).select().single();
  else res = await sb.from("people").insert(row).select().single();
  if (res.error) { setStatus("Couldn't save: " + res.error.message); return; }
  if (!me.id) { me.id = res.data.id; try { localStorage.setItem("sb-me", me.id); } catch (e) {} }
  setStatus("Saved"); $("meNote").textContent = me.name ? "" : "Add your name so the team can see who's free.";
  loadPeople();
}
function setStatus(t) { $("status").textContent = t; }

$("crew").addEventListener("click", e => {
  const b = e.target.closest("[data-claim]"); if (!b) return;
  const p = people.find(x => x.id === b.dataset.claim); if (!p) return;
  me = { id: p.id, name: p.name || "", role: p.role || "", slots: new Set(p.slots || []) };
  try { localStorage.setItem("sb-me", me.id); } catch (e) {}
  $("meName").value = me.name; $("meRole").value = me.role; $("meNote").textContent = "";
  renderAll(); window.scrollTo({ top: 0, behavior: "smooth" });
});

$("evForm").addEventListener("submit", async e => {
  e.preventDefault();
  if (!sb) return;
  const roles = [...$("evRoles").querySelectorAll("input:checked")].map(i => i.value);
  const ev = { title: $("evTitle").value.trim(), type: $("evType").value, date: $("evDate").value, call: $("evCall").value,
    wrap: $("evWrap").value, loc: $("evLoc").value.trim(), roles, notes: $("evNotes").value.trim() };
  if (!ev.title || !ev.date) return;
  if (!roles.length) { $("evMsg").textContent = "Tick at least one role so the right people see it."; return; }
  $("evSubmit").disabled = true;
  const { error } = await sb.from("events").insert(ev);
  if (error) $("evMsg").textContent = "Couldn't add it: " + error.message;
  else { $("evMsg").textContent = "Added."; ["evTitle", "evLoc", "evNotes"].forEach(id => $(id).value = "");
    $("evRoles").querySelectorAll("input").forEach(i => i.checked = false); loadEvents(); }
  $("evSubmit").disabled = false;
});

async function loadPeople() {
  const { data, error } = await sb.from("people").select("*");
  if (error) { setStatus("Couldn't load the crew: " + error.message); return; }
  people = data; renderHeat(); renderCrew();
}
async function loadEvents() {
  const { data, error } = await sb.from("events").select("*").gte("date", todayIso);
  if (error) { setStatus("Couldn't load the schedule: " + error.message); return; }
  events = data; renderEvents();
}

/* ---------- boot ---------- */
renderAll();
(async () => {
  if (!window.supabase || SUPABASE_URL.startsWith("PASTE")) {
    setStatus("Not connected"); $("meNote").textContent = "Add your Supabase URL and key at the top of the script to turn on saving.";
    $("addWrap").hidden = true; return;
  }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  let saved = null; try { saved = localStorage.getItem("sb-me"); } catch (e) {}
  await Promise.all([loadPeople(), loadEvents()]);
  const mine = saved && people.find(p => p.id === saved);
  if (mine) { me = { id: mine.id, name: mine.name || "", role: mine.role || "", slots: new Set(mine.slots || []) }; }
  $("meName").value = me.name; $("meRole").value = me.role;
  $("meNote").textContent = me.id ? "" : "New here? Add your name and role, then tap your free slots. Already on the list from another device? Tap \"This is me\" on your card below.";
  renderAll(); setStatus("Live");
  // live updates when anyone changes something
  sb.channel("board")
    .on("postgres_changes", { event: "*", schema: "public", table: "people" }, loadPeople)
    .on("postgres_changes", { event: "*", schema: "public", table: "events" }, loadEvents)
    .subscribe();
})();
</script>
</body>
</html>
